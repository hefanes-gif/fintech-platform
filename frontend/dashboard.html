<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#38bdf8">

<link rel="apple-touch-icon" href="/icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#38bdf8">

<link rel="apple-touch-icon" href="icon-192.png">
<title>Fintech Premium</title>

<style>

:root{
  --bg:#0b1220;
  --panel:#111827;
  --card:#1e293b;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --accent:#38bdf8;
  --green:#22c55e;
  --red:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  height:100vh;
  background:var(--panel);
  position:fixed;
  left:0;
  top:0;
  padding:20px;
  transition:0.3s;
  z-index:1000;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:var(--accent);
  margin-bottom:30px;
}

.nav-link{
  display:block;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  color:var(--muted);
  cursor:pointer;
  transition:0.3s;
}

.nav-link:hover{
  background:rgba(56,189,248,0.1);
  color:white;
}

.nav-link.active{
  background:var(--accent);
  color:white;
}

/* MAIN */
.main{
  margin-left:250px;
  width:100%;
  padding:20px;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.menu-btn{
  display:none;
  font-size:24px;
  cursor:pointer;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card h4{
  color:var(--muted);
  margin-bottom:10px;
}

.balance{
  font-size:30px;
  font-weight:bold;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:15px;
  margin-top:25px;
  flex-wrap:wrap;
}

button{
  border:none;
  padding:14px 18px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.deposit{
  background:var(--green);
  color:white;
}

.withdraw{
  background:var(--red);
  color:white;
}

button:hover{
  opacity:0.85;
}

/* TABLE */
.table-box{
  overflow-x:auto;
  margin-top:30px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--panel);
  border-radius:15px;
  overflow:hidden;
}

th,td{
  padding:15px;
  text-align:left;
  border-bottom:1px solid #222;
}

th{
  color:var(--accent);
}

/* PAGES */
.page{
  display:none;
  animation:fade 0.3s ease;
}

.active-page{
  display:block;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* MOBILE */
@media(max-width:768px){

  .sidebar{
    left:-260px;
  }

  .sidebar.show{
    left:0;
  }

  .main{
    margin-left:0;
    padding:15px;
  }

  .menu-btn{
    display:block;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
  }

  button{
    width:100%;
  }

}

</style>
</head>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("PWA Ready 🚀"))
    .catch(err => console.log(err));
}
</script>
<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

  <div class="logo">💳 Fintech Pro</div>

  <div class="nav-link active" onclick="showPage('dashboard',event)">
    🏠 Dashboard
  </div>

  <div class="nav-link" onclick="showPage('wallet',event)">
    💰 Wallet
  </div>

  <div class="nav-link" onclick="showPage('transactions',event)">
    📄 Transactions
  </div>

  <div class="nav-link" onclick="showPage('settings',event)">
    ⚙ Settings
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">

    <div class="menu-btn" onclick="toggleSidebar()">
      ☰
    </div>

    <h2>Welcome Back 👋</h2>

    <div>
      👤 User
    </div>

  </div>

  <!-- DASHBOARD -->
  <section id="dashboard" class="page active-page">

    <div class="grid">

      <div class="card">
        <h4>Wallet Balance</h4>
        <div class="balance" id="balance">
          KES 0
        </div>
      </div>

      <div class="card">
        <h4>Total Deposits</h4>
        <div class="balance">
          KES 0
        </div>
      </div>

      <div class="card">
        <h4>Total Withdrawals</h4>
        <div class="balance">
          KES 0
        </div>
      </div>

    </div>

  </section>

  <!-- WALLET -->
  <section id="wallet" class="page">

    <div class="actions">

      <button class="deposit">
        + Deposit
      </button>

      <button class="withdraw">
        - Withdraw
      </button>

    </div>

  </section>

  <!-- TRANSACTIONS -->
  <section id="transactions" class="page">

    <div class="table-box">

      <table>

        <thead>
          <tr>
            <th>Type</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="txTable">
          <tr>
            <td>Deposit</td>
            <td>KES 100</td>
            <td>Success</td>
          </tr>
        </tbody>

      </table>

    </div>

  </section>

  <!-- SETTINGS -->
  <section id="settings" class="page">

    <div class="card">
      <h3>Settings</h3>
      <p>Profile settings coming soon.</p>
    </div>

  </section>

</div>

<script>

function showPage(pageId,event){

  document.querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active-page");
    });

  document.getElementById(pageId)
    .classList.add("active-page");

  document.querySelectorAll(".nav-link")
    .forEach(link=>{
      link.classList.remove("active");
    });

  event.target.classList.add("active");

  // auto close sidebar mobile
  if(window.innerWidth < 768){
    document.getElementById("sidebar")
      .classList.remove("show");
  }

}

function toggleSidebar(){
  document.getElementById("sidebar")
    .classList.toggle("show");
}

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("/service-worker.js")
      .then(reg => console.log("Service Worker Registered"))
      .catch(err => console.log(err));
  });
}
</script>

</body>
</html>
